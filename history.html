<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History | StressSense AI</title>
<style>
  body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;min-height:100vh}
  .sidebar{width:260px;background:#2a2147;color:#fff;padding:24px;box-sizing:border-box;flex-shrink:0}
  .sidebar a{color:#fff;text-decoration:none}
  .main-content{flex-grow:1;background:#edf2f9;padding:40px;box-sizing:border-box;min-width:0}
  .card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 4px 6px rgba(0,0,0,.05);border:1px solid #e2e8f0;margin-top:24px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
  .stats .card{margin:0;padding:18px}
  .stat-label{font-size:13px;color:#6b6485}
  .stat-val{font-size:32px;font-weight:700;margin-top:4px}
  .profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:10px}
  .profile-grid div span{display:block;font-size:12px;color:#6b6485}
  .profile-grid div b{font-size:15px}
  .badge{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:600;font-size:13px;color:#fff}
  .btn{background:#6d4aff;color:#fff;border:none;padding:10px 22px;font-size:14px;font-weight:bold;border-radius:30px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.ghost{background:#fff;color:#e11d48;border:1px solid #fecaca}
  .btn.sm{padding:6px 14px;font-size:12px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  details{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-top:12px;background:#fff}
  summary{cursor:pointer;display:flex;align-items:center;gap:14px;flex-wrap:wrap;list-style:none}
  summary::-webkit-details-marker{display:none}
  .pct{font-size:26px;font-weight:700;min-width:64px}
  .when{color:#554d73;font-size:14px;flex:1;min-width:160px}
  .ctx{font-size:13px;color:#6b6485;margin-top:10px}
  .bar-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
  .bar-row span:first-child{width:140px}
  .bar-row .track{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
  .bar-row .fill{height:100%;background:#6b6485}
  .empty{text-align:center;color:#6b6485;padding:30px 0}
  .disclaimer{font-size:12px;color:#6b6485;margin-top:12px}
  @media(max-width:800px){body{flex-direction:column}.sidebar{width:100%}.stats{grid-template-columns:1fr 1fr}.main-content{padding:24px}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style id="theme">
:root{--ink:#2a2147;--muted:#6b6485;--violet:#6d4aff;--plum:#3b2a6b;--coral:#ff6b8a;--teal:#14b8a6;--sun:#ffb84d;--sky:#38bdf8;--line:#e8e2f8}
body{font-family:'Nunito','Segoe UI',Tahoma,sans-serif;color:var(--ink)}
h1{font-weight:800;font-size:38px;margin:0 0 4px;letter-spacing:-.5px}
h2{font-weight:600;font-size:17px;color:var(--muted);margin:0}
h3{font-weight:800}
a{color:var(--violet)}
.sidebar{background:linear-gradient(175deg,#2a1f55 0%,#4a2f8f 58%,#8a3fa6 100%)}
.sidebar h2{display:flex;align-items:center;gap:10px;color:#fff;font-size:21px;font-weight:800;margin:0 0 22px}
.sidebar h2:before{content:"";width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#ffb84d,#ff6b8a);box-shadow:0 4px 12px rgba(255,107,138,.45)}
.sidebar p{margin:4px 0}
.sidebar p a{display:block;padding:10px 14px;border-radius:12px;font-weight:600;transition:background .15s}
.sidebar p a:hover{background:rgba(255,255,255,.14)}
.sidebar p a.active{background:rgba(255,255,255,.2)}
.sidebar #who{color:#d9ceff!important;padding:0 14px;margin-bottom:14px}
.main-content{background:radial-gradient(900px 420px at 100% 0,#ffe3dc 0,transparent 60%),radial-gradient(800px 460px at 0 100%,#d6f5ee 0,transparent 60%),#f6f3ff}
.card{border-radius:20px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(74,47,143,.08)}
.dashboard-grid .card:nth-child(1){border-top:5px solid var(--violet)}
.dashboard-grid .card:nth-child(2){border-top:5px solid var(--teal)}
#planBox{border-top:5px solid var(--coral)}
#profileCard{border-top:5px solid var(--violet)}
.stats .card:nth-child(1){border-top:5px solid var(--violet)}
.stats .card:nth-child(2){border-top:5px solid var(--teal)}
.stats .card:nth-child(3){border-top:5px solid var(--coral)}
.stats .card:nth-child(4){border-top:5px solid var(--sun)}
#greet{text-align:center;font-size:18px;font-weight:600;color:var(--muted)}
.video-wrap{background:linear-gradient(135deg,#3b2a6b,#6d4aff);border-radius:16px}
#cameraPlaceholder{color:#e6deff;font-weight:600}
#progressBar,.gauge,.bar-row .track{background:#ece7fb}
#progressFill{background:linear-gradient(90deg,#14b8a6,#6d4aff,#ff6b8a)}
.bar-row .fill{background:linear-gradient(90deg,#38bdf8,#6d4aff)}
.badge{box-shadow:0 3px 8px rgba(0,0,0,.12)}
.tip,.plan-note{background:#fff5e0;border-left:4px solid var(--sun);border-radius:12px}
.plan-sec{border:none;border-radius:16px}
.plan-sec:nth-child(4n+1){background:#e8f8f4}.plan-sec:nth-child(4n+2){background:#efeaff}
.plan-sec:nth-child(4n+3){background:#ffeceb}.plan-sec:nth-child(4n){background:#e6f4fe}
#scanBtn,#submitBtn,.btn{background:linear-gradient(135deg,#6d4aff,#a24bff 60%,#ff6b8a);box-shadow:0 8px 20px rgba(109,74,255,.3);transition:transform .15s,box-shadow .15s}
#scanBtn:hover,#submitBtn:hover,.btn:hover{background:linear-gradient(135deg,#5b3de0,#9240ef 60%,#f55a7c);transform:translateY(-2px)}
#scanBtn:disabled,#submitBtn:disabled{background:#c4b8f0;box-shadow:none;transform:none}
.btn.ghost{background:#fff;color:#e11d48;border:1px solid #ffd0d9;box-shadow:none}
.btn.ghost:hover{background:#fff1f3;transform:none}
input,select{border:1.5px solid var(--line);border-radius:12px;background:#fcfbff}
input:focus,select:focus{border-color:var(--violet)!important;box-shadow:0 0 0 4px rgba(109,74,255,.15)!important}
label{color:var(--ink)}
details{border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(74,47,143,.05)}
details[open]{background:#fbfaff}
.profile-grid div{background:#f6f3ff;border-radius:14px;padding:10px 14px}
:focus-visible{outline:3px solid rgba(109,74,255,.45);outline-offset:2px}
.sidebar{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;background-attachment:local}
@media(max-width:800px){.sidebar{position:static;height:auto;align-self:stretch}}
</style>
</head>
<body>
<div class="sidebar">
  <h2>StressSense AI</h2>
  <p id="who" style="font-size:13px;color:#94a3b8"></p>
  <p><a href="stresssense_v2 (2),html.html">🏠 Home</a></p>
  <p><a class="active" href="history.html">📈 History</a></p>
  <p><a href="login.html" id="loginLink">🔑 Log in</a></p>
  <p id="logoutItem" style="display:none"><a href="#" id="logoutLink">👋 Log out</a></p>
</div>

<div class="main-content">
  <h1 style="text-align:center">Your journey</h1>
  <h2 style="text-align:center">Your profile and past scans</h2>

  <div class="card" id="profileCard"></div>
  <div class="stats" id="stats"></div>
  <div class="card"><h3 style="margin-top:0">Stress over time</h3><div id="chart"></div></div>

  <div class="card">
    <div class="toolbar">
      <h3 style="margin:0">Scan history</h3>
      <div><button class="btn sm" id="exportBtn">Export CSV</button> <button class="btn sm ghost" id="clearBtn">Clear all</button></div>
    </div>
    <div id="list"></div>
    <div class="disclaimer">Stored only in this browser. Estimates are for self-awareness, not a medical diagnosis.</div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const read = (k,d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e) { return d; } };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const LABELS = { furrow:'Brow furrow', browLow:'Lowered brows', squint:'Eye tension', lips:'Pressed lips',
                   frown:'Mouth corners down', blink:'Blink rate', fidget:'Head restlessness', emotion:'Negative emotion' };
  const color = p => p<25 ? '#059669' : p<50 ? '#d97706' : p<75 ? '#ea580c' : '#e11d48';
  const fmt = iso => new Date(iso).toLocaleString([], {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

  let history = read('stresssenseHistory', []);
  const profile = read('stresssenseProfile', null);
  const save = () => localStorage.setItem('stresssenseHistory', JSON.stringify(history));

  function renderProfile() {
    if (!profile) {
      $('profileCard').innerHTML = '<h3 style="margin-top:0">Your profile</h3><p style="color:#6b6485">You are not logged in yet. <a href="login.html">Log in</a> to save your details with each scan.</p>';
      return;
    }
    $('who').textContent = 'Logged in as ' + profile.name;
    const items = [['Name',profile.name],['Age',profile.age],['Profession',profile.profession],
      ['Working hours',profile.workHours+' h/day'],['Screen time',profile.screenTime+' h/day'],
      ['Bedtime',profile.bedtime],['Wake-up',profile.wakeup],['Sleep',profile.sleepHours+' h']];
    $('profileCard').innerHTML = '<div class="toolbar"><h3 style="margin:0">Your profile</h3><a class="btn sm" href="login.html">Edit details</a></div><div class="profile-grid">'
      + items.map(([l,v]) => `<div><span>${l}</span><b>${esc(v)}</b></div>`).join('') + '</div>';
  }

  function renderStats() {
    const n = history.length, last = history[n-1], prev = history[n-2];
    const avg = n ? Math.round(history.reduce((a,h)=>a+h.pct,0)/n) : null;
    const max = n ? Math.max(...history.map(h=>h.pct)) : null;
    let trend = '—';
    if (last && prev) { const d = last.pct - prev.pct; trend = (d>0?'▲ +':d<0?'▼ ':'■ ') + d; }
    const cell = (l,v,c) => `<div class="card"><div class="stat-label">${l}</div><div class="stat-val" style="color:${c||'#2a2147'}">${v}</div></div>`;
    $('stats').innerHTML = cell('Total scans', n) + cell('Average stress', avg===null?'—':avg+'%', avg===null?null:color(avg))
      + cell('Highest', max===null?'—':max+'%', max===null?null:color(max)) + cell('Change vs previous', trend);
  }

  function renderChart() {
    if (history.length < 2) { $('chart').innerHTML = '<div class="empty">Complete at least two scans to see your trend.</div>'; return; }
    const W=640, H=200, L=34, R=10, T=10, B=24, pts = history.slice(-30);
    const x = i => L + i*(W-L-R)/(pts.length-1), y = v => T + (100-v)*(H-T-B)/100;
    let g = '';
    [0,25,50,75,100].forEach(v => g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text x="${L-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#6b6485">${v}</text>`);
    const line = pts.map((h,i)=>`${x(i)},${y(h.pct)}`).join(' ');
    const dots = pts.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.pct)}" r="5" fill="${color(h.pct)}" stroke="#fff" stroke-width="2"><title>${fmt(h.time)} — ${h.pct}%</title></circle>`).join('');
    $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}<polyline points="${line}" fill="none" stroke="#6d4aff" stroke-width="2.5"/>${dots}</svg>`;
  }

  function renderList() {
    if (!history.length) { $('list').innerHTML = '<div class="empty">No scans yet. <a href="stresssense_v2 (2),html.html">Run your first scan</a>.</div>'; return; }
    $('list').innerHTML = [...history].reverse().map(h => {
      const c = color(h.pct), p = h.profile;
      const ctx = p ? `Sleep ${esc(p.sleepHours)}h · Screen ${esc(p.screenTime)}h · Work ${esc(p.workHours)}h · ${esc(p.name)}, ${esc(p.age)}, ${esc(p.profession)}` : 'No profile was saved with this scan.';
      const rows = Object.keys(h.signals||{}).sort((a,b)=>h.signals[b]-h.signals[a]).map(k =>
        `<div class="bar-row"><span>${LABELS[k]||k}${k==='blink'?` (${h.blinks} · ${h.blinkRate}/min)`:''}</span><div class="track"><div class="fill" style="width:${Math.round(h.signals[k]*100)}%"></div></div><span style="width:36px;text-align:right">${Math.round(h.signals[k]*100)}%</span></div>`).join('');
      return `<details><summary><span class="pct" style="color:${c}">${h.pct}%</span><span class="badge" style="background:${c}">${esc(h.level)}</span><span class="when">${fmt(h.time)}</span><span style="font-size:13px;color:#6b6485">Confidence: ${esc(h.confidence)}</span></summary>
        <div class="ctx">${ctx}</div><div style="font-weight:600;font-size:14px;margin:12px 0 4px">Signals detected</div>${rows}
        <div style="margin-top:12px"><button class="btn sm ghost" data-del="${h.id}">Delete this scan</button></div></details>`;
    }).join('');
  }

  function render() { renderProfile(); renderStats(); renderChart(); renderList(); }

  $('list').addEventListener('click', e => {
    const id = e.target.dataset.del; if (!id) return;
    history = history.filter(h => String(h.id) !== id); save(); render();
  });
  $('clearBtn').addEventListener('click', () => {
    if (history.length && confirm('Delete all saved scans? This cannot be undone.')) { history = []; save(); render(); }
  });
  $('exportBtn').addEventListener('click', () => {
    if (!history.length) return;
    const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
    const rows = [['Time','Stress %','Level','Confidence','Name','Age','Profession','Work h','Screen h','Sleep h']]
      .concat(history.map(h => { const p = h.profile || {}; return [h.time,h.pct,h.level,h.confidence,p.name,p.age,p.profession,p.workHours,p.screenTime,p.sleepHours]; }));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')], {type:'text/csv'}));
    a.download = 'stresssense_history.csv'; a.click();
  });

  render();
})();
</script>
<script>
// Show LOGIN when logged out, LOGOUT when logged in
(function () {
  let loggedIn = false;
  try { loggedIn = !!localStorage.getItem('stresssenseProfile'); } catch (e) {}
  const login = document.getElementById('loginLink'), out = document.getElementById('logoutItem');
  if (login) login.parentElement.style.display = loggedIn ? 'none' : '';
  if (out) {
    out.style.display = loggedIn ? '' : 'none';
    document.getElementById('logoutLink').addEventListener('click', function (e) {
      e.preventDefault();
      if (!confirm('Log out? Your saved scan history will be kept.')) return;
      try { localStorage.removeItem('stresssenseProfile'); } catch (err) {}
      window.location.href = 'login.html';
    });
  }
})();
</script>
</body>
</html>
